server {
    listen 80;
    server_name _;
    client_max_body_size 70m;           # pinturas de hasta 50 MB + cifrado

    root /usr/share/nginx/html;
    index index.html;

    # API y avatares -> FastAPI
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location /static/ {
        proxy_pass http://backend:8000;
    }

    # Módulos Python del worker: sin caché, para que un deploy nuevo se note de inmediato
    location /python/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # React Router: cualquier otra ruta devuelve index.html
    location / {
        try_files $uri /index.html;
    }
}